name: VietMatch
options:
  bundleIdPrefix: com.vietmatch
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Dev Debug: debug
  Dev Release: release
  Staging Debug: debug
  Staging Release: release
  Production Debug: debug
  Production Release: release
  UIPreview Debug: debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: VietMatch/App/Info.plist

packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: "5.9.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.12.0"
  Swinject:
    url: https://github.com/Swinject/Swinject
    from: "2.9.0"

targets:
  VietMatch:
    type: application
    platform: iOS
    sources:
      - path: VietMatch
        excludes:
          - "**/.DS_Store"
    resources:
      - path: VietMatch/App/Resources/Assets.xcassets
      - path: VietMatch/App/Resources/GoogleService-Info.plist
        optional: true
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: VietMatch/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: VietMatch/App/VietMatch.entitlements
        ENABLE_PREVIEWS: true
      configs:
        Dev Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vietmatch.app.dev
          PRODUCT_NAME: VM Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEV
          IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        Dev Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.vietmatch.app.dev
          PRODUCT_NAME: VM Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEV
          IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        Staging Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vietmatch.app.staging
          PRODUCT_NAME: VM Staging
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG STAGING
          IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        Staging Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.vietmatch.app.staging
          PRODUCT_NAME: VM Staging
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
          IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        Production Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vietmatch.app
          PRODUCT_NAME: VietMatch
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PRODUCTION
          IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        Production Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.vietmatch.app
          PRODUCT_NAME: VietMatch
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PRODUCTION
          IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        UIPreview Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vietmatch.app.uipreview
          PRODUCT_NAME: VM Preview
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG UIPREVIEW
          IPHONEOS_DEPLOYMENT_TARGET: "17.6"
    dependencies:
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: FirebaseSDK
        product: FirebaseStorage
      - package: FirebaseSDK
        product: FirebaseMessaging
      - package: FirebaseSDK
        product: FirebaseAnalytics
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: Alamofire
      - package: Kingfisher
      - package: Swinject
    entitlements:
      path: VietMatch/App/VietMatch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default

  VietMatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VietMatchTests
    dependencies:
      - target: VietMatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vietmatch.app.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Dev Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VM Dev.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VM Dev"
        Dev Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VM Dev.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VM Dev"
        Staging Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VM Staging.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VM Staging"
        Staging Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VM Staging.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VM Staging"
        Production Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VietMatch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VietMatch"
        Production Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VietMatch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VietMatch"
        UIPreview Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VM Preview.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VM Preview"

  VietMatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VietMatchUITests
    dependencies:
      - target: VietMatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vietmatch.app.uitests
        TEST_TARGET_NAME: VietMatch

schemes:
  VietMatch-Dev:
    build:
      targets:
        VietMatch: all
        VietMatchTests: [test]
        VietMatchUITests: [test]
    run:
      config: Dev Debug
    test:
      config: Dev Debug
      targets:
        - VietMatchTests
        - VietMatchUITests
    profile:
      config: Dev Release
    analyze:
      config: Dev Debug
    archive:
      config: Dev Release

  VietMatch-Staging:
    build:
      targets:
        VietMatch: all
        VietMatchTests: [test]
        VietMatchUITests: [test]
    run:
      config: Staging Debug
    test:
      config: Staging Debug
      targets:
        - VietMatchTests
        - VietMatchUITests
    profile:
      config: Staging Release
    analyze:
      config: Staging Debug
    archive:
      config: Staging Release

  VietMatch-Production:
    build:
      targets:
        VietMatch: all
        VietMatchTests: [test]
        VietMatchUITests: [test]
    run:
      config: Production Debug
    test:
      config: Production Debug
      targets:
        - VietMatchTests
        - VietMatchUITests
    profile:
      config: Production Release
    analyze:
      config: Production Debug
    archive:
      config: Production Release

  VietMatch-UIPreview:
    build:
      targets:
        VietMatch: all
    run:
      config: UIPreview Debug
    test:
      config: UIPreview Debug
      targets: []
    profile:
      config: UIPreview Debug
    analyze:
      config: UIPreview Debug
    archive:
      config: UIPreview Debug
